name: Build PhantomRE APK with BlackBox Core
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc || true
      - name: Checkout PhantomRE
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Install NDK 29
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager 'ndk;29.0.13846066'
      - name: Clone NewBlackbox engine
        run: git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git /tmp/nbb
      - name: Copy modules into android
        run: |
          cp -r /tmp/nbb/Bcore android/Bcore
          cp -r /tmp/nbb/black-reflection android/black-reflection
          cp -r /tmp/nbb/compiler android/compiler
          ls -la android/
      - name: Patch settings.gradle
        run: |
          printf '%s\n' '' "include ':Bcore'" "include ':black-reflection'" "include ':compiler'" >> android/settings.gradle
          cat android/settings.gradle
      - name: Flutter pub get
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhantomRE-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
