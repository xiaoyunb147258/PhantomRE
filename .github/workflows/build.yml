name: Build PhantomRE APK with BlackBox Core
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc || true
      - name: Checkout PhantomRE
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Install NDK 29
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(find /usr/local/lib/android /opt -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" 'ndk;29.0.13846066'
      - name: Clone NewBlackbox engine
        run: git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git /tmp/nbb
      - name: Copy modules into android
        run: |
          cp -r /tmp/nbb/Bcore android/Bcore
          cp -r /tmp/nbb/black-reflection android/black-reflection
          cp -r /tmp/nbb/compiler android/compiler
          ls -la android/
      - name: Patch settings.gradle
        run: |
          printf '%s\n' '' "include ':Bcore'" "include ':black-reflection'" "include ':compiler'" >> android/settings.gradle
          cat android/settings.gradle
      - name: Patch root build.gradle
        run: |
          printf '%s\n' '' 'ext {' '    compileSdkVersion = 35' '    minSdk = 29' '    targetSdkVersion = 34' '    versionCode = 1' "    versionName = '1.0.0'" '}' >> android/build.gradle
          printf '%s\n' '' 'allprojects {' '    repositories {' '        maven { url "https://www.jitpack.io" }' '        google()' '        mavenCentral()' '    }' '}' >> android/build.gradle
          cat android/build.gradle
      - name: Flutter pub get
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --debug --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhantomRE-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
